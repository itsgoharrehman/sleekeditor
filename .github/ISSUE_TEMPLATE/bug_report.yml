name: Bug Report
description: Report an issue, formatting glitch, or unexpected behavior in sleekeditor
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue.
        If this is an XSS vulnerability or security issue, please do NOT use this form; refer to [SECURITY.md](https://github.com/itsgoharrehman/sleekeditor/blob/main/SECURITY.md) instead.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to reproduce the formatting glitch.
      placeholder: |
        1. Type text into editor
        2. Select text and click 'H1'
        3. Observe formatting behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment Information
      description: Browser, OS, and version.
      placeholder: |
        - Browser: Chrome 124 / Firefox 125 / Safari 17
        - OS: Windows 11 / macOS 14 / Linux
        - Editor Version: 1.2.0
    validations:
      required: true